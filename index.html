<!DOCTYPE html>
<html lang="ja">
<head>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>仕組みを基礎から | ITAIST</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="site-header">
  <div class="palette-stripe" aria-hidden="true">
    <span class="s1"></span><span class="s2"></span><span class="s3"></span><span class="s4"></span>
  </div>
  <div class="header-inner">
    <div class="header-top">
      <div class="header-title">
        <h1>仕組みを基礎から</h1>
        <p class="header-sub">ITAIST — AI・IT・金融の仕組みを基礎から</p>
      </div>
      <div class="palette-dropdown" id="palette-dropdown">
        <button type="button" class="palette-button" id="palette-button" aria-haspopup="listbox" aria-expanded="false" aria-label="カラーパレット">
          <span class="palette-swatch" id="palette-current-swatch" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
          <span class="palette-button-name" id="palette-current-name"></span>
          <span class="palette-caret" aria-hidden="true">▽</span>
        </button>
        <div class="palette-menu" id="palette-menu" role="listbox" aria-label="カラーパレット" hidden></div>
      </div>
    </div>
  </div>
</header>

<main>
  <section class="summary" id="summary" aria-label="集計">
    <div class="summary-item"><span class="summary-num" id="count-total">–</span><span class="summary-label">エピソード</span></div>
    <div class="summary-item"><span class="summary-num" id="count-listened">–</span><span class="summary-label">聴いた</span></div>
    <div class="summary-item"><span class="summary-num" id="count-shown">–</span><span class="summary-label">表示中</span></div>
  </section>

  <section class="controls" aria-label="検索と並び替え">
    <input type="search" id="search" placeholder="検索（タイトル・説明）" autocomplete="off">
    <select id="sort-order" aria-label="並び順">
      <option value="desc">新しい順</option>
      <option value="asc">古い順</option>
    </select>
  </section>

  <p class="status-msg" id="status-msg" hidden></p>
  <div id="episodes" class="cards"></div>
</main>

<footer>
  <p>データ： Supabase（podcast_episodes）</p>
</footer>

<script src="app.js"></script>
</body>
</html>
